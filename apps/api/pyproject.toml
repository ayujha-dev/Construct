[project]
name = "shieldstaff"
version = "0.1.0"
description = "ShieldStaff interactive vertical slice API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "pydantic>=2.7,<3",
  "rapidfuzz>=3.9,<4",
  "ijson>=3.2,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5.0,<6",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
