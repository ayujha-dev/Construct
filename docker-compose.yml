services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bert
      POSTGRES_USER: bert
      POSTGRES_PASSWORD: bert_dev_secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bert -d bert"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
